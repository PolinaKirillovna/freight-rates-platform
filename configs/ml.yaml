# Гиперпараметры прогона обучения ML (ml/train.py).
# Этот файл — единственный источник истины; снимок кладётся в ml.model_runs.params на каждом запуске.
# Путь переопределяется переменной окружения ML_CONFIG.

split:
  train_months: 3        # длина обучающего окна
  test_weeks: 3          # длина тестового окна, заканчивается датой снимка
  validation_days: 14    # хвост train только для ранней остановки CatBoost

cleaning:
  iqr_k: 3.0             # множитель порога IQR по ln(цена за км), считается только на train

# target_transform: log — модель учится на np.log(цена), прогноз — np.exp(predict); none — на рублях.
models:
  catboost:
    target_transform: log
    loss_function: RMSE
    learning_rate: 0.06
    depth: 8
    l2_leaf_reg: 3.0
    iterations: 3000
    od_type: Iter
    od_wait: 200
  ridge:
    target_transform: none   # оставлена на исходной цели для сопоставимости с базовой постановкой
    alpha: 1.0
  decision_tree:
    target_transform: log
    max_depth: 14
    min_samples_leaf: 15
